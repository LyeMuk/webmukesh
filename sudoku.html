<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sudoku</title>

    <link rel="stylesheet" href="css/sudoku.css">
</head>

<body>
    <h1>Sudoku</h1>
    <hr>
    <h2 id="errors">0</h2>

    <!-- 9x9 board -->
    <div id="board"></div>
    <br>
    <div id="digits">
    </div>
    <br>
    <button onclick="solve()">Solve</button>
    <button onclick="location.reload()">New Puzzle</button>
    <p><a href="index.html">&larr; Back to portfolio</a></p>

</body>

<script>

    var numSelected = null;
    var tileSelected = null;
    var solveSelected = null;

    var errors = 0;

    // ---- puzzle generation (runs in the browser, so no backend is needed) ----
    function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function candidates(g, r, c) {
        let used = {};
        for (let i = 0; i < 9; i++) {
            used[g[r][i]] = true;
            used[g[i][c]] = true;
        }
        let br = r - (r % 3), bc = c - (c % 3);
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                used[g[br + i][bc + j]] = true;
            }
        }
        let out = [];
        for (let n = 1; n <= 9; n++) {
            if (!used[n]) out.push(n);
        }
        return out;
    }

    // Backtracking. Fills the grid in place; with limit > 1 it only counts solutions.
    function solveGrid(g, randomise, limit) {
        let best = null, bestCands = null;
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                if (g[r][c] != 0) continue;
                let cands = candidates(g, r, c);
                if (cands.length == 0) return 0;
                if (best == null || cands.length < bestCands.length) {
                    best = [r, c];
                    bestCands = cands;
                }
            }
        }
        if (best == null) return 1; // no empty cell left: solved

        if (randomise) shuffle(bestCands);
        let found = 0;
        for (let n of bestCands) {
            g[best[0]][best[1]] = n;
            found += solveGrid(g, randomise, limit);
            if (found >= limit) {
                if (limit == 1) return found; // keep the filled grid
                g[best[0]][best[1]] = 0;
                return found;
            }
            g[best[0]][best[1]] = 0;
        }
        return found;
    }

    function makePuzzle(blanks) {
        let full = [];
        for (let r = 0; r < 9; r++) full.push([0, 0, 0, 0, 0, 0, 0, 0, 0]);
        solveGrid(full, true, 1);

        let puzzle = full.map(row => row.slice());
        let cells = [];
        for (let i = 0; i < 81; i++) cells.push(i);
        shuffle(cells);

        let removed = 0;
        for (let i of cells) {
            if (removed >= blanks) break;
            let r = Math.floor(i / 9), c = i % 9;
            let keep = puzzle[r][c];
            puzzle[r][c] = 0;
            // only blank a cell if the puzzle still has exactly one solution
            let copy = puzzle.map(row => row.slice());
            if (solveGrid(copy, false, 2) == 1) {
                removed++;
            } else {
                puzzle[r][c] = keep;
            }
        }
        return {
            board: puzzle.map(row => row.map(v => v == 0 ? "-" : v)),
            sol: full
        };
    }

    var puzzle = makePuzzle(42);
    var board = puzzle.board;
    var solution = puzzle.sol;

    window.onload = function () {
        setGame();
    }

    function setGame() {
        // Digits 1-9
        for (let i = 1; i <= 9; i++) {
            //<div id="1" class="number">1</div>
            let number = document.createElement("div");
            number.id = i
            number.innerText = i;
            number.addEventListener("click", selectNumber);
            number.classList.add("number");
            document.getElementById("digits").appendChild(number);
        }

        // Board 9x9
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                let tile = document.createElement("div");
                tile.id = r.toString() + "-" + c.toString();
                if (board[r][c] != "-") {
                    tile.innerText = board[r][c];
                    tile.classList.add("tile-start");
                }
                if (r == 2 || r == 5) {
                    tile.classList.add("horizontal-line");
                }
                if (c == 2 || c == 5) {
                    tile.classList.add("vertical-line");
                }
                tile.addEventListener("click", selectTile);
                tile.classList.add("tile");
                document.getElementById("board").append(tile);
            }
        }
    }

    function selectNumber() {
        if (numSelected != null) {
            numSelected.classList.remove("number-selected");
        }
        numSelected = this;
        numSelected.classList.add("number-selected");
    }

    function selectTile() {
        if (numSelected) {
            if (this.innerText != "") {
                return;
            }

            // "0-0" "0-1" .. "3-1"
            let coords = this.id.split("-"); //["0", "0"]
            let r = parseInt(coords[0]);
            let c = parseInt(coords[1]);

            if (solution[r][c] == numSelected.id) {
                this.innerText = numSelected.id;
            }
            else {
                errors += 1;
                document.getElementById("errors").innerText = errors;
            }
        }
    }

    function solve() {
        document.getElementById("board").innerHTML = "";
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                let tile = document.createElement("div");
                tile.id = r.toString() + "-" + c.toString();
                if (solution[r][c] != "-") {
                    tile.innerText = solution[r][c];
                    tile.classList.add("tile-start");
                }
                if (r == 2 || r == 5) {
                    tile.classList.add("horizontal-line");
                }
                if (c == 2 || c == 5) {
                    tile.classList.add("vertical-line");
                }
                tile.addEventListener("click", selectTile);
                tile.classList.add("tile");
                document.getElementById("board").append(tile);
            }
        }
    }

</script>


</html>
